<script type="text/javascript">
  RED.nodes.registerType("tibber-notify", {
    category: "Tibber API",
    color: "#23B8CC",
    defaults: {
      name: {
        value: ""
      },
      active: {
        value: true
      },
      apiEndpointRef: { value: null, type: "tibber-api-endpoint" },
      notifyTitle: {
        value: ""
      },
      notifyMessage: {
        value: ""
      },
      notifyScreen: {
        value: ""
      }
    },
    inputs: 1,
    outputs: 0,
    align: "right",
    icon: "envelope.png",
    label: function() {
      return this.name || "tibber-notify";
    }
  });
</script>

<script type="text/x-red" data-template-name="tibber-notify">
  <div class="form-row" style="white-space: nowrap;">
      <label style="white-space:nowrap;width:150px;" for="node-input-apiEndpointRef"><i class="icon-tag"></i> API Endpoint</label>
      <input type="text" id="node-input-apiEndpointRef" placeholder="API Endpoint">
  </div>
  <div class="form-row" style="white-space: nowrap;">
      <label style="white-space:nowrap;width:150px;" for="node-input-name"><i class="icon-tag"></i> Name</label>
      <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <hr>

  <div class="form-row" style="white-space: nowrap;">
    <label style="white-space:nowrap;width:150px;" for="node-input-notifyTitle"><i class="icon-tag"></i> Notification title</label>
    <input type="text" id="node-input-notifyTitle" placeholder="{payload.title}" />
  </div>
  <div class="form-row" style="white-space: nowrap;">
    <label style="white-space:nowrap;width:150px;" for="node-input-notifyMessage"><i class="icon-tag"></i> Notification message</label>
    <input type="text" id="node-input-notifyMessage" placeholder="{payload.message}" />
  </div>
  <div class="form-row" style="white-space: nowrap;">
    <label style="white-space:nowrap;width:150px;" for="node-input-notifyScreen"><i class="icon-tag"></i> Landing screen</label>
    <input type="text" id="node-input-notifyScreen" placeholder="{payload.screen}" />
  </div>
</script>

<script type="text/x-red" data-help-name="tibber-notify">
  <p>Sends a push notification to the Tibber app.</p>
  <h3>Input</h3>
  <p>Values set on the node are used first. Values left empty on the node are read from <code>msg.payload</code>.</p>
  <dl class="message-properties">
    <dt class="optional">payload.title <span class="property-type">string</span></dt>
    <dd>title of the notification.</dd>
    <dt class="optional">payload.message <span class="property-type">string</span></dt>
    <dd>text of the notification.</dd>
    <dt class="optional">payload.screen <span class="property-type">string</span></dt>
    <dd>screen to open in the app: <code>HOME</code>, <code>REPORTS</code>, <code>CONSUMPTION</code>, <code>COMPARISON</code>, <code>DISAGGREGATION</code>, <code>HOME_PROFILE</code>, <code>CUSTOMER_PROFILE</code>, <code>METER_READING</code>, <code>NOTIFICATIONS</code> or <code>INVOICES</code>. The default is <code>HOME</code>.</dd>
  </dl>
  <h3>Details</h3>
  <p>If the notification can not be sent, the node reports an error that can be handled with a Catch node.</p>
</script>
