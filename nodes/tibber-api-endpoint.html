<script type="text/javascript">
  (function () {
    var statusTimer;

    const urlValidator = function (url) {
      var regExp = /((([A-Za-z]{3,9}:(?:\/\/)?)(?:[\-;:&=\+\$,\w]+@)?[A-Za-z0-9\.\-]+|(?:www\.|[\-;:&=\+\$,\w]+@)[A-Za-z0-9\.\-]+)((?:\/[\+~%\/\.\w\-_]*)?\??(?:[\-\+=&;%@\.\w_]*)#?(?:[\.\!\/\\\w]*))?)/;
      return new RegExp(regExp).test(url);
    };

    function stopStatusTimer() {
      clearInterval(statusTimer);
      statusTimer = undefined;
    }

    // A login keeps the Client ID and Client Secret in Node-RED's memory. They are encrypted and written
    // to disk by a deploy. If a login has not been deployed yet, enable Deploy and say so. This also covers
    // a login that reloaded the editor, where the dialog and what was typed in it are gone.
    var notified = {};
    var notifications = [];
    function askForDeploy() {
      $.getJSON("tibber-api/unsaved", function (data) {
        (data.ids || []).forEach(function (id) {
          var node = RED.nodes.node(id);
          if (!node || notified[id]) {
            return;
          }
          notified[id] = true;
          node.changed = true;
          RED.nodes.dirty(true);
          notifications.push(RED.notify("You have logged in to Tibber. Click <b>Deploy</b> to save the Client ID and Client Secret, so the login survives a restart of Node-RED.", { type: "warning", timeout: 20000 }));
        });
      });
    }
    RED.events.on("flows:loaded", askForDeploy);
    RED.events.on("deploy", function () {
      notified = {};
      notifications.forEach(function (notification) { notification.close(); });
      notifications = [];
    });
    // Editors that do not announce when the flows are loaded.
    setTimeout(askForDeploy, 5000);

    RED.nodes.registerType("tibber-api-endpoint", {
      category: "config",
      credentials: {
        accessToken: {
          type: 'password',
        },
        clientId: {
          type: 'text',
        },
        clientSecret: {
          type: 'password',
        },
      },
      defaults: {
        // Empty on endpoints created before the login was added. They use the access token.
        authType: {
          value: ""
        },
        scopes: {
          value: "openid profile email offline_access data-api-user-read data-api-homes-read data-api-vehicles-read data-api-chargers-read data-api-thermostats-read data-api-energy-systems-read data-api-inverters-read data-api-meters-read"
        },
        redirectUri: {
          value: ""
        },
        queryUrl: {
          value: "https://api.tibber.com/v1-beta/gql",
          validate: (value) => {
            var queryUrl = $("#node-config-input-queryUrl").val();
            return urlValidator(value ? value : queryUrl) || urlValidator(value);
          }
        },
        feedConnectionTimeout: {
          value: 30,
          required: true,
          validate: (value) => {
            if (value < 5) {
              $("#node-config-input-feedConnectionTimeout").val(5);
              return false;
            }
            return RED.validators.number(value);
          }
        },
        feedTimeout: {
          value: 60,
          required: true,
          validate: (value) => {
            if (value < 5) {
              $("#node-config-input-feedTimeout").val(5);
              return false;
            }
            return RED.validators.number(value);
          }
        },
        queryRequestTimeout: {
          value: 30,
          required: true,
          validate: (value) => {
            if (value < 5) {
              $("#node-config-input-queryRequestTimeout").val(5);
              return false;
            }
            return RED.validators.number(value);
          }
        },
        name: {
          value: ""
        }
      },
      label: function () {
        return this.name ? this.name : (this.authType === 'oauth' ? 'Tibber Login' : 'Access Token');
      },
      oneditprepare: function () {
        var node = this;
        if (!this.feedConnectionTimeout) {
          this.feedConnectionTimeout = 30;
          $("#node-config-input-feedConnectionTimeout").val(this.feedConnectionTimeout);
        }
        if (!this.queryRequestTimeout) {
          this.queryRequestTimeout = 30;
          $("#node-config-input-queryRequestTimeout").val(this.queryRequestTimeout);
        }

        // New endpoints log in with client ID and secret. Endpoints that already have an access token keep using it.
        if (!this.authType) {
          $("#node-config-input-authType").val(this.credentials && this.credentials.has_accessToken ? "token" : "oauth");
        }
        function showAuthType() {
          var oauth = $("#node-config-input-authType").val() === "oauth";
          $(".tibber-auth-oauth").toggle(oauth);
          $(".tibber-auth-token").toggle(!oauth);
        }
        $("#node-config-input-authType").on("change", showAuthType);
        showAuthType();

        // The address Tibber sends the browser to after the login. It must be registered on the OAuth client.
        if (!this.redirectUri) {
          $("#node-config-input-redirectUri").val(new URL("tibber-api/callback", window.location.href.split(/[?#]/)[0]).href);
        }

        // Set when a login has been started from this dialog.
        // The time of the latest login, as known when a login was started from this dialog.
        var latestLogin = 0;
        var waitingFrom;
        // The stored secret belongs to the stored client. Ask for the secret again when the Client ID is changed.
        var originalClientId = $("#node-config-input-clientId").val();
        $("#node-config-input-clientId").on("change", function () {
          var secret = $("#node-config-input-clientSecret");
          if ($(this).val() !== originalClientId && secret.val() === "__PWRD__") {
            secret.val("").attr("placeholder", "Enter the secret of the new client").focus();
          }
        });

        node._tibberUnsaved = false;
        function showStatus() {
          $.getJSON("tibber-api/" + node.id + "/status", function (data) {
            $("#node-config-tibber-login-status").text(data.authorized ? "Logged in" : "Not logged in");
            // The client used for a login is only in memory until a deploy.
            node._tibberUnsaved = !!data.unsaved;
            $("#node-config-tibber-login-saved").toggle(!!data.unsaved);
            latestLogin = data.lastLogin || 0;
            // Stop asking when the login that was started here has finished.
            if (waitingFrom !== undefined && latestLogin !== waitingFrom) {
              waitingFrom = undefined;
              stopStatusTimer();
            }
          });
        }
        showStatus();

        function showError(xhr, text) {
          var message = xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : xhr.statusText;
          RED.notify(text + message, "error");
        }

        $("#node-config-tibber-login").on("click", function () {
          // Open the window right away. A window opened later, when the address has arrived, can be blocked as a popup.
          var loginWindow = window.open("", "tibber-login", "width=600,height=820");
          $("#node-config-tibber-login-saved").hide();
          $.ajax({
            url: "tibber-api/" + node.id + "/auth",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({
              clientId: $("#node-config-input-clientId").val(),
              clientSecret: $("#node-config-input-clientSecret").val(),
              scopes: $("#node-config-input-scopes").val(),
              redirectUri: $("#node-config-input-redirectUri").val(),
              // Where to go back to, if the login takes over this page instead of opening a window.
              returnUrl: window.location.href
            }),
            success: function (data) {
              waitingFrom = latestLogin;
              if (loginWindow) {
                loginWindow.location.href = data.url;
              } else {
                window.open(data.url, "_blank");
              }
              stopStatusTimer();
              statusTimer = setInterval(showStatus, 2000);
              // A login must be finished within ten minutes.
              setTimeout(function () { if (waitingFrom !== undefined) { waitingFrom = undefined; stopStatusTimer(); } }, 10 * 60 * 1000);
            },
            error: function (xhr) {
              if (loginWindow) {
                loginWindow.close();
              }
              showError(xhr, "Unable to start the login: ");
            }
          });
        });

        $("#node-config-tibber-complete").on("click", function () {
          $.ajax({
            url: "tibber-api/" + node.id + "/auth/complete",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ url: $("#node-config-tibber-pasted-url").val() }),
            success: function () {
              $("#node-config-tibber-pasted-url").val("");
              showStatus();
            },
            error: function (xhr) {
              showError(xhr, "");
            }
          });
        });
      },
      oneditsave: function () {
        stopStatusTimer();
        // Enable Deploy when a login is waiting to be saved, even if no field was changed.
        if (this._tibberUnsaved) {
          return true;
        }
      },
      oneditcancel: function () {
        stopStatusTimer();
        if (this._tibberUnsaved) {
          askForDeploy();
        }
      }
    });
  })();
</script>

<script type="text/x-red" data-help-name="tibber-api-endpoint">
  <p>Connection to Tibber, shared by the Tibber nodes.</p>
  <h3>Authentication</h3>
  <p><b>Log in with client ID and secret</b> works with all Tibber nodes, and is required by the
    <i>tibber-data-api</i> and <i>tibber-data-api-feed</i> nodes.</p>
  <ol>
    <li>Create an OAuth client at <a href="https://data-api.tibber.com/clients/manage/" target="_blank">data-api.tibber.com</a>.
      Add the <b>Redirect URI</b> shown here to the client, and select the scopes you need.</li>
    <li>Enter the <b>Client ID</b> and <b>Client Secret</b> of the client here.</li>
    <li>Click <b>Log in to Tibber</b> and log in in the window that opens. The status changes to <i>Logged in</i>.</li>
    <li>Save the configuration and deploy.</li>
  </ol>
  <h3>Redirect URI</h3>
  <p>After you log in, Tibber sends <i>your browser</i> to the Redirect URI with a one-time code, and Node-RED exchanges
    the code for tokens. Tibber never connects to Node-RED, so Node-RED does not have to be reachable from the internet.</p>
  <p>The Redirect URI must be exactly the same here and on the client at Tibber, and Tibber only accepts addresses that
    start with <code>https://</code> or <code>http://localhost</code>.</p>
  <ul>
    <li><b>Editor opened through <code>localhost</code> or an <code>https</code> address:</b> use the suggested Redirect URI
      and <b>Log in to Tibber</b>. Use <code>localhost</code> rather than <code>127.0.0.1</code>.</li>
    <li><b>Editor opened through another <code>http</code> address</b>, such as <code>http://192.168.1.10:1880</code>, or
      through Home Assistant: set the Redirect URI to <code>http://localhost:1880/tibber-api/callback</code> here and on
      the client. After logging in, the browser shows an error page, which is expected. Copy the whole address of that
      page into <b>Or paste</b> and click <b>Finish login</b>.</li>
    <li><b>Only the HTTP In nodes are public:</b> Node-RED also answers on <code>/tibber-api/callback</code> next to the
      HTTP In nodes. Set the Redirect URI to your public <code>https</code> address followed by
      <code>/tibber-api/callback</code>.</li>
  </ul>
  <p>If Tibber shows <i>Something went wrong: invalid_request</i> instead of its login page, the Redirect URI is not
    registered on the client, or differs from the one here.</p>
  <p>A login must be finished within 10 minutes, and the address can only be used once. See the README for more.</p>
  <p><b>Access token</b> uses a personal access token from
    <a href="https://developer.tibber.com/" target="_blank">developer.tibber.com</a>. It works with all nodes except
    <i>tibber-data-api</i> and <i>tibber-data-api-feed</i>.</p>
  <h3>Properties</h3>
  <dl class="message-properties">
    <dt>Scopes</dt>
    <dd>Scopes to request when logging in, separated by spaces. Remove the scopes that are not selected on the client.
      A device is only visible with the scope for its kind, and <code>data-api-meters-read</code> is needed for live
      measurements through the Tibber Data API.</dd>
    <dt>GraphQL Endpoint</dt>
    <dd>URL of the Tibber GraphQL API. The default is <code>https://api.tibber.com/v1-beta/gql</code>.</dd>
    <dt>Connection Timeout</dt>
    <dd>Seconds to wait for the live feed to connect.</dd>
    <dt>Feed Timeout</dt>
    <dd>Seconds without data before the live feed reconnects.</dd>
    <dt>Request Timeout</dt>
    <dd>Seconds to wait for a response to a query.</dd>
  </dl>
  <h3>Details</h3>
  <p>The access token and the client secret are stored with the Node-RED credentials and are not included when flows are exported.</p>
  <p>The login gives Node-RED tokens that are renewed automatically. They are stored in the file
    <code>tibber-api-tokens.json</code> in the Node-RED user directory, not in the flow.
    Log in again if Node-RED has been stopped for about 30 days.</p>
</script>
