<script type="text/javascript">
  (function () {
    var statusTimer;

    function stopStatusTimer() {
      clearInterval(statusTimer);
      statusTimer = undefined;
    }

    RED.nodes.registerType("tibber-data-api-endpoint", {
      category: "config",
      credentials: {
        clientId: { type: "text" },
        clientSecret: { type: "password" }
      },
      defaults: {
        name: {
          value: ""
        },
        scopes: {
          value: "openid profile email offline_access data-api-user-read data-api-homes-read data-api-vehicles-read data-api-chargers-read data-api-thermostats-read data-api-energy-systems-read data-api-inverters-read data-api-meters-read"
        }
      },
      label: function () {
        return this.name ? this.name : "Tibber Data API";
      },
      oneditprepare: function () {
        var node = this;
        // The address Tibber sends the browser back to after the login. It must be registered on the OAuth client.
        var redirectUri = new URL("tibber-data-api/callback", window.location.href.split(/[?#]/)[0]).href;
        $("#node-config-tibber-redirect-uri").val(redirectUri);

        function showStatus() {
          $.getJSON("tibber-data-api/" + node.id + "/status", function (data) {
            $("#node-config-tibber-login-status").text(data.authorized ? "Logged in" : "Not logged in");
          });
        }
        showStatus();

        $("#node-config-tibber-login").on("click", function () {
          $.ajax({
            url: "tibber-data-api/" + node.id + "/auth",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({
              clientId: $("#node-config-input-clientId").val(),
              clientSecret: $("#node-config-input-clientSecret").val(),
              scopes: $("#node-config-input-scopes").val(),
              redirectUri: redirectUri
            }),
            success: function (data) {
              window.open(data.url, "_blank");
              stopStatusTimer();
              statusTimer = setInterval(showStatus, 2000);
            },
            error: function (xhr) {
              var message = xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : xhr.statusText;
              RED.notify("Unable to start the login: " + message, "error");
            }
          });
        });
      },
      oneditsave: stopStatusTimer,
      oneditcancel: stopStatusTimer
    });
  })();
</script>

<script type="text/x-red" data-template-name="tibber-data-api-endpoint">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-config-input-clientId"><i class="fa fa-id-card-o"></i> Client ID</label>
    <input type="text" id="node-config-input-clientId" placeholder="Client ID">
  </div>
  <div class="form-row">
    <label for="node-config-input-clientSecret"><i class="fa fa-key"></i> Client Secret</label>
    <input type="password" id="node-config-input-clientSecret" placeholder="Client Secret">
  </div>
  <div class="form-row">
    <label for="node-config-input-scopes"><i class="fa fa-list"></i> Scopes</label>
    <input type="text" id="node-config-input-scopes" placeholder="Scopes">
  </div>
  <div class="form-row">
    <label for="node-config-tibber-redirect-uri"><i class="fa fa-reply"></i> Redirect URI</label>
    <input type="text" id="node-config-tibber-redirect-uri" readonly>
  </div>
  <div class="form-row">
    <label for="node-config-tibber-login"><i class="fa fa-sign-in"></i> Login</label>
    <button type="button" class="red-ui-button" id="node-config-tibber-login">Log in to Tibber</button>
    <span id="node-config-tibber-login-status" style="margin-left: 10px;"></span>
  </div>
</script>

<script type="text/x-red" data-help-name="tibber-data-api-endpoint">
  <p>Connection to the Tibber Data API, shared by the Tibber Data API nodes.</p>
  <h3>Setup</h3>
  <ol>
    <li>Create an OAuth client at <a href="https://data-api.tibber.com/clients/manage/" target="_blank">data-api.tibber.com</a>.
      Add the <b>Redirect URI</b> shown here to the client, and select the scopes you need.</li>
    <li>Enter the <b>Client ID</b> and <b>Client Secret</b> of the client here.</li>
    <li>Click <b>Log in to Tibber</b> and log in in the window that opens. The status changes to <i>Logged in</i>.</li>
    <li>Save the configuration and deploy.</li>
  </ol>
  <h3>Properties</h3>
  <dl class="message-properties">
    <dt>Scopes</dt>
    <dd>Scopes to request when logging in, separated by spaces. Remove the scopes that are not selected on the client.
      A device is only visible with the scope for its kind, and <code>data-api-meters-read</code> is needed for live measurements.</dd>
    <dt>Redirect URI</dt>
    <dd>The address Tibber sends the browser back to after the login. It follows the address used to open the Node-RED editor.
      Tibber requires <code>https</code>, except for <code>localhost</code>.</dd>
  </dl>
  <h3>Details</h3>
  <p>The Tibber Data API does not accept the access token used by the other Tibber nodes.</p>
  <p>The login gives Node-RED tokens that are renewed automatically. They are stored in the file
    <code>tibber-data-api-tokens.json</code> in the Node-RED user directory, not in the flow, and are not included when flows are exported.
    Log in again if the tokens have not been used for about 30 days.</p>
</script>
